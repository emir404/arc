<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!--
    The 48px picture from favicon.ico: the wordmark on a faint globe, in the logo's ink.
    On a dark browser theme the filter repaints every pixel in the site's page colour (#f2efe8), keeping its transparency.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      image {
        filter: url(#light);
      }
    }
  </style>
  <filter id="light" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0 0 0 0 0.949  0 0 0 0 0.937  0 0 0 0 0.910  0 0 0 1 0" />
  </filter>
  <image width="48" height="48" href="data:image/png;base64," />
</svg>
